name: Styleguide CI

on:
  push:
    branches:
      - master
      - feat/multi-account
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: styleguide-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "10.9.2"
      - run: npm ci
      - name: Verify checkout-independent LESS entries
        run: node --test config/webpack.less.test.cjs
      - run: npm run lint
      - run: npm run test:unit -- --runInBand
      - name: Build versioned fork tarball
        run: |
          npm run pack:fork -- \
            --out ui-artifact \
            --require-clean \
            --require-pinned-toolchain
      - name: Write checksums
        run: cd ui-artifact && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: passbolt-styleguide-fork
          path: ui-artifact/
          if-no-files-found: error
